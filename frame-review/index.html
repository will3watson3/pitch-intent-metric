<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitch Intent Frame Review</title>
  <link rel="stylesheet" href="/frame-review/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="title-block">
      <h1>Setup Frame Review</h1>
      <p id="statusText">Loading</p>
    </div>
    <nav class="top-actions" aria-label="Project views">
      <a href="/" class="nav-link">Labeler</a>
      <a href="/dashboard/" class="nav-link">Dashboard</a>
      <a href="/frame-review/" class="nav-link active">Frame Review</a>
      <a href="/target-audit/" class="nav-link">Target Audit</a>
      <a href="/intent-audit/" class="nav-link">Intent Audit</a>
    </nav>
  </header>

  <main class="review">
    <section class="toolbar-panel" aria-label="Filters">
      <label class="field">
        <span>Pitcher</span>
        <select id="pitcherFilter"></select>
      </label>
      <label class="field">
        <span>Pitch Type</span>
        <select id="pitchTypeFilter"></select>
      </label>
      <label class="field">
        <span>Family</span>
        <select id="familyFilter"></select>
      </label>
      <label class="field">
        <span>Visibility</span>
        <select id="visibilityFilter"></select>
      </label>
      <label class="field">
        <span>Status</span>
        <select id="statusFilter"></select>
      </label>
      <label class="field">
        <span>Vision Review</span>
        <select id="visionReviewFilter"></select>
      </label>
      <label class="field">
        <span>Vision Status</span>
        <select id="visionStatusFilter"></select>
      </label>
      <label class="field search-field">
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="Pitch ID, result, note">
      </label>
      <label class="field">
        <span>Sort</span>
        <select id="sortSelect">
          <option value="pitcher">Pitcher</option>
          <option value="vision_priority">Vision Priority</option>
          <option value="vision_delta">Vision Delta</option>
          <option value="date_desc">Date Desc</option>
          <option value="status">Status</option>
          <option value="time">Frame Time</option>
        </select>
      </label>
    </section>

    <section class="overlay-panel panel" aria-label="Overlay calibration">
      <div class="panel-head">
        <h2>Zone Overlay</h2>
        <span id="overlayReadout">-</span>
      </div>
      <div class="overlay-controls">
        <label class="check-field">
          <input id="showZoneToggle" type="checkbox">
          <span>Show Zone</span>
        </label>
        <label class="check-field">
          <input id="editZoneToggle" type="checkbox">
          <span>Edit Zone</span>
        </label>
        <label class="check-field">
          <input id="showTargetToggle" type="checkbox">
          <span>Show Target</span>
        </label>
        <label class="field scope-field">
          <span>Save Scope</span>
          <select id="overlayScopeSelect">
            <option value="game">Current Game</option>
            <option value="default">Global Default</option>
          </select>
        </label>
        <label class="field range-field">
          <span>Left</span>
          <input id="overlayLeft" type="range" min="20" max="70" step="0.5">
        </label>
        <label class="field range-field">
          <span>Top</span>
          <input id="overlayTop" type="range" min="5" max="70" step="0.5">
        </label>
        <label class="field range-field">
          <span>Width</span>
          <input id="overlayWidth" type="range" min="0.1" max="36" step="0.5">
        </label>
        <label class="field range-field">
          <span>Height</span>
          <input id="overlayHeight" type="range" min="0.1" max="60" step="0.5">
        </label>
        <button id="resetOverlayButton" type="button" class="ghost">Reset</button>
        <button id="saveOverlayButton" type="button">Save Zone</button>
        <button id="nextCalibrationButton" type="button" class="ghost">Next Uncalibrated Game</button>
      </div>
    </section>

    <section class="kpi-strip" id="kpiStrip" aria-label="Summary metrics"></section>

    <section class="selected-panel panel">
      <div class="panel-head">
        <h2>Selected Frame</h2>
        <div class="selected-nav">
          <button id="prevPitchButton" type="button" class="ghost">Prev Pitch</button>
          <span id="selectedTitle">No frame selected</span>
          <button id="nextPitchButton" type="button">Next Pitch</button>
          <button id="nextReviewButton" type="button" class="ghost">Next Review</button>
        </div>
      </div>
      <div class="selected-layout">
        <div>
          <div id="selectedStage" class="selected-stage"></div>
          <div id="frameButtons" class="frame-buttons"></div>
        </div>
        <div id="selectedMeta" class="selected-meta"></div>
      </div>
      <div class="review-label-panel">
        <div class="review-label-head">
          <h3>Vision Review Label</h3>
          <span id="reviewLabelStatus">Not reviewed</span>
        </div>
        <div id="reviewButtons" class="review-buttons"></div>
        <label class="field review-note-field">
          <span>Notes</span>
          <input id="reviewNotesInput" type="text" placeholder="Optional review note">
        </label>
      </div>
      <div class="link-row">
        <a id="videoLink" href="#" target="_blank" rel="noreferrer">Open MP4</a>
        <a id="savantLink" href="#" target="_blank" rel="noreferrer">Open Savant</a>
      </div>
    </section>

    <section class="gallery-panel panel">
      <div class="panel-head">
        <h2>Frame Gallery</h2>
        <span id="frameCount">0 frames</span>
      </div>
      <div id="frameGrid" class="frame-grid"></div>
      <div class="load-more-row">
        <button id="loadMoreButton" type="button" class="ghost">Load More</button>
      </div>
    </section>
  </main>

  <script src="/frame-review/app.js"></script>
</body>
</html>
