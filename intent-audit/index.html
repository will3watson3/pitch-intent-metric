<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intent Model Audit</title>
  <link rel="stylesheet" href="/intent-audit/styles.css">
</head>
<body>
  <header>
    <div><h1>Intent Model Audit</h1><p id="statusText">Loading model results…</p></div>
    <nav>
      <a href="/">Labeler</a><a href="/target-audit/">Target Audit</a>
      <a class="active" href="/intent-audit/">Intent Audit</a>
    </nav>
  </header>
  <main>
    <section class="toolbar">
      <label><span>Pitcher</span><select id="pitcherFilter"></select></label>
      <label><span>Model</span><select id="modelSelect"></select></label>
      <label><span>Review</span><select id="reviewFilter">
        <option value="pending">Pending first</option><option value="all">All pitches</option>
        <option value="reviewed">Reviewed only</option><option value="available" selected>Available estimates</option>
      </select></label>
      <div class="progress"><strong id="progressText">0 reviewed</strong><div><span id="progressBar"></span></div></div>
    </section>

    <section class="pitch-nav">
      <button id="prevButton" class="secondary">← Previous</button>
      <div><strong id="positionText">Pitch 0 of 0</strong><span id="pitchTitle">—</span></div>
      <button id="nextButton" class="secondary">Next →</button>
    </section>

    <section class="audit-grid">
      <article class="panel zone-panel">
        <div class="panel-head"><h2>Target and finish map</h2><span>Pitcher view</span></div>
        <div id="plot" class="plot" aria-label="Pitch target plot"></div>
        <div class="legend">
          <span><i class="detector"></i>Detector target</span>
          <span><i class="audited"></i>Audited target</span>
          <span><i class="inferred"></i>Inferred target</span>
          <span><i class="actual"></i>Actual pitch</span>
        </div>
        <div id="modelStatus" class="model-status"></div>
        <dl id="modelDetails"></dl>
      </article>

      <article class="panel video-panel">
        <div class="panel-head"><h2>Pitch video</h2><span id="videoStatus">—</span></div>
        <video id="pitchVideo" controls preload="metadata" playsinline></video>
        <div class="video-links"><a id="mp4Link" target="_blank" rel="noreferrer">Open MP4</a><a id="savantLink" target="_blank" rel="noreferrer">Open Savant</a></div>
        <dl id="pitchDetails"></dl>
      </article>
    </section>

    <section class="review-panel panel">
      <div><strong>Does this inferred target look plausible?</strong><span id="savedReview">Not reviewed</span></div>
      <label><span>Optional note</span><input id="reviewNotes" type="text" placeholder="Why does this estimate look right or wrong?"></label>
      <div class="review-buttons">
        <button data-review="plausible" class="plausible">Plausible</button>
        <button data-review="uncertain" class="uncertain">Uncertain</button>
        <button data-review="wrong" class="wrong">Wrong</button>
      </div>
    </section>
  </main>
  <script src="/intent-audit/app.js"></script>
</body>
</html>
